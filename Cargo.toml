[package]
name = "one"
version = "0.1.0"
edition = "2024"
description = "Export Microsoft OneNote notebooks to GitHub Flavored Markdown"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
onenote_parser = { version = "2.1", features = ["onepkg"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typed-path = "0.12"

[dev-dependencies]
tempfile = "3"
