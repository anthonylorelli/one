name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os_name }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: one
          - os_name: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: one
          - os_name: macOS
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: one
          - os_name: macOS
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: one
          - os_name: Windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: one.exe
          - os_name: Windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            bin: one.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ASSET="one-${{ steps.version.outputs.tag }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} staging/
          cp README.md staging/
          tar -czf "dist/${ASSET}" -C staging ${{ matrix.bin }} README.md

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "one-${{ steps.version.outputs.tag }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} staging/
          Copy-Item README.md staging/
          Compress-Archive -Path staging/${{ matrix.bin }}, staging/README.md -DestinationPath "dist/$asset" -Force

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          sha256sum one-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
